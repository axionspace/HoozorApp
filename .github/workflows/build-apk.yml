on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Generate Full Project Files Automatically
        run: python3 setup_hozoor.py

      - name: 3. Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 4. Setup Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: 5. Install cargo-ndk
        uses: taiki-e/install-action@cargo-ndk

      - name: 6. Run Rust Core Tests
        working-directory: rust-core
        run: cargo test -- --nocapture

      - name: 7. Build Rust Native Libraries (.so for 32-bit & 64-bit)
        working-directory: rust-core
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)}"
          cargo ndk -t arm64-v8a -t armeabi-v7a \
            -o ../android-app/app/src/main/jniLibs \
            build --release

      - name: 8. Generate UniFFI Kotlin Bindings
        working-directory: rust-core
        run: |
          cargo build --release
          cargo run --bin uniffi-bindgen generate \
            --library target/release/libhozoor_core.so \
            --language kotlin \
            --out-dir ../android-app/app/src/main/java

      - name: 9. Download Vazirmatn-FD Font
        run: |
          curl -fsSL -o vazir.zip https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip
          unzip -q vazir.zip -d vazir_tmp
          mkdir -p android-app/app/src/main/res/font
          cp "$(find vazir_tmp -name 'Vazirmatn-FD-Regular.ttf' | head -n 1)" android-app/app/src/main/res/font/vazirmatn_regular.ttf
          cp "$(find vazir_tmp -name 'Vazirmatn-FD-Medium.ttf' | head -n 1)" android-app/app/src/main/res/font/vazirmatn_medium.ttf
          cp "$(find vazir_tmp -name 'Vazirmatn-FD-Bold.ttf' | head -n 1)" android-app/app/src/main/res/font/vazirmatn_bold.ttf
          cp "$(find vazir_tmp -name 'Vazirmatn-FD-ExtraBold.ttf' | head -n 1)" android-app/app/src/main/res/font/vazirmatn_extrabold.ttf
          rm -rf vazir.zip vazir_tmp

      - name: 10. Create Release Signing Keystore
        working-directory: android-app/app
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias hozoor \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass hozoor123456 -keypass hozoor123456 \
            -dname "CN=HozoorApp, OU=School, O=Avini, L=Iran, C=IR"

      - name: 11. Setup Gradle & Build Signed APKs
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: 12. Assemble Release APKs
        working-directory: android-app
        run: gradle assembleRelease

      - name: 13. Upload Ready-to-Install APKs
        uses: actions/upload-artifact@v4
        with:
          name: Hozoor-APKs
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

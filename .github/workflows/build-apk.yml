name: Build Hozoor Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v5

      - name: 2. Generate Rust & Android Project Files
        run: |
          python3 setup_part1_rust.py
          python3 setup_part2_android_base.py
          python3 setup_part3_screens.py

      - name: 3. Setup Node.js 26 LTS
        uses: actions/setup-node@v5
        with:
          node-version: '26'

      - name: 4. Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 5. Setup Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: 6. Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: 7. Run Rust Core Tests
        working-directory: rust-core
        run: cargo test -- --nocapture

      - name: 8. Build Rust Native Libraries (arm64-v8a & armeabi-v7a)
        working-directory: rust-core
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1)}"
          test -n "$ANDROID_NDK_HOME" || { echo "Android NDK not found"; exit 1; }
          cargo ndk -t arm64-v8a -t armeabi-v7a \
            -o ../android-app/app/src/main/jniLibs \
            build --release

      - name: 9. Generate UniFFI Kotlin Bindings
        working-directory: rust-core
        run: |
          cargo build --release
          cargo run --bin uniffi-bindgen generate \
            --library target/release/libhozoor_core.so \
            --language kotlin \
            --out-dir ../android-app/app/src/main/java
          test -n "$(find ../android-app/app/src/main/java -name 'hozoor_core.kt' -print -quit)" || {
            echo "UniFFI bindings were not generated"; exit 1;
          }

      - name: 10. Download Vazirmatn-FD Font
        run: |
          curl -fsSL -o vazir.zip https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip
          unzip -q vazir.zip -d vazir_tmp
          mkdir -p android-app/app/src/main/res/font
          cp "$(find vazir_tmp -name 'Vazirmatn-FD-Regular.ttf' | head -n 1)" android-app/app/src/main/res/font/vazirmatn_regular.ttf
          cp "$(find vazir_tmp -name 'Vazirmatn-FD-Medium.ttf' | head -n 1)" android-app/app/src/main/res/font/vazirmatn_medium.ttf
          cp "$(find vazir_tmp -name 'Vazirmatn-FD-Bold.ttf' | head -n 1)" android-app/app/src/main/res/font/vazirmatn_bold.ttf
          cp "$(find vazir_tmp -name 'Vazirmatn-FD-ExtraBold.ttf' | head -n 1)" android-app/app/src/main/res/font/vazirmatn_extrabold.ttf
          rm -rf vazir.zip vazir_tmp

      - name: 11. Create Release Signing Keystore
        working-directory: android-app/app
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias hozoor \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass hozoor123456 -keypass hozoor123456 \
            -dname "CN=HozoorApp, OU=Education, O=Hozoor, L=Iran, C=IR"

      - name: 12. Install Gradle 8.13
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: 13. Build Release APKs
        working-directory: android-app
        run: gradle assembleRelease

      - name: 14. Upload Ready-to-Install APKs
        uses: actions/upload-artifact@v7
        with:
          name: Hozoor-APKs-v2
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

[package]
name = "hozoor_core"
version = "3.0.0"
edition = "2021"

[lib]
name = "hozoor_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28.3", features = ["cli"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
calamine = "0.26.1"
zip = "=2.5.0"
rust_xlsxwriter = "0.80.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
